# =============================================================================
#  Job de ingesta y transformación (Lakeflow Jobs): Azure SQL (CDC) → bronze → silver → gold
#  1. preparar_entorno : esquemas y Volumes que necesita la ingesta (idempotente)
#  2. ingesta_sqlserver: extracción CDC + Auto Loader (availableNow) a bronze
#  3. transformacion_silver_gold: pipeline declarativo bronze → silver → gold
#  Cómputo serverless: sin bloque de cluster en las tareas.
# =============================================================================
resources:
  jobs:
    andina_ingesta:
      name: andina_ingesta
      description: Azure SQL (CDC) → landing → bronze (Auto Loader) → silver y gold (pipeline declarativo).

      tasks:
        - task_key: preparar_entorno
          notebook_task:
            notebook_path: ../src/ingesta/nb_preparar_entorno.ipynb
            base_parameters:
              catalogo: ${var.catalogo}
              storage_account: ${var.storage_account}

        - task_key: ingesta_sqlserver
          depends_on:
            - task_key: preparar_entorno
          notebook_task:
            notebook_path: ../src/ingesta/nb_bronze_sqlserver_ingesta.ipynb
            base_parameters:            # llenan los widgets del notebook
              catalogo: ${var.catalogo}
              secret_scope: ${var.secret_scope}
              etapa: todo
              tablas: "*"
              forzar_full: "false"
          max_retries: 1                # reintento seguro: el watermark solo avanza tras escribir

        - task_key: transformacion_silver_gold
          depends_on:
            - task_key: ingesta_sqlserver
          pipeline_task:
            pipeline_id: ${resources.pipelines.andina_transformacion.id}
            full_refresh: false         # incremental: solo procesa lo nuevo de bronze

      # Modo estándar de serverless: más barato; en batch no importa el arranque.
      performance_target: STANDARD

      # Una corrida diaria a las 02:00 (hora de Lima): el negocio analiza el día
      # anterior y la retención de CDC (7 días) deja 6 días de margen ante caídas.
      # Queda en pausa: se activa a propósito al pasar a producción.
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: America/Lima
        pause_status: PAUSED

      # Evita dos corridas a la vez sobre los mismos watermarks.
      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - ${var.correo_alertas}

      tags:
        proyecto: andinamarket
        capa: ingesta
