# =============================================================================
#  Pipeline SILVER (Lakeflow Declarative Pipelines)
#  bronze → silver: limpieza, calidad (cuarentena) y AUTO CDC (SCD1 / SCD2)
#  - Un notebook por entidad en src/transformacion/silver/ (lista explícita abajo).
#  - root_path: permite que los notebooks importen los módulos comunes (.py).
#  - Serverless y triggered: procesa lo nuevo y se apaga (nunca continuous).
#  - Lo ejecuta la tarea transformacion_silver del job_andina_diario.
# =============================================================================
resources:
  pipelines:
    pl_andina_silver:
      name: pl_andina_silver
      catalog: ${var.catalogo}
      schema: silver                    # las tablas se publican en <catalogo>.silver
      serverless: true
      continuous: false
      channel: CURRENT
      root_path: ../src/transformacion/silver
      libraries:
        - notebook:
            path: ../src/transformacion/silver/slv_cuarentena.ipynb
        - notebook:
            path: ../src/transformacion/silver/slv_clientes.ipynb
        - notebook:
            path: ../src/transformacion/silver/slv_productos.ipynb
        - notebook:
            path: ../src/transformacion/silver/slv_pedidos.ipynb
        - notebook:
            path: ../src/transformacion/silver/slv_items_pedido.ipynb
        - notebook:
            path: ../src/transformacion/silver/slv_pagos.ipynb
        - notebook:
            path: ../src/transformacion/silver/slv_pagos_historial_estados.ipynb
        - notebook:
            path: ../src/transformacion/silver/slv_tickets.ipynb
        - notebook:
            path: ../src/transformacion/silver/slv_controles_integridad.ipynb
      configuration:
        catalogo: ${var.catalogo}       # lo leen los módulos comunes con spark.conf.get("catalogo")
      tags:
        proyecto: andinamarket
        capa: silver
