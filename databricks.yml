# =============================================================================
#  Andina Market · Declarative Automation Bundle (antes Databricks Asset Bundle)
#
#  QUÉ es: la definición como código de todo lo que se despliega en Databricks.
#  UN solo bundle con DOS targets (dev y prd): el mismo código va a los dos
#  ambientes; solo cambian las variables (catálogo, secret scope y storage).
#
#  Qué despliega (carpeta resources/, una subcarpeta por tipo de recurso):
#    jobs/job_andina_diario.yml       orquestación: preparar → ingesta (bronze) → silver → gold
#    pipelines/pl_andina_silver.yml   pipeline declarativo de silver (un notebook por entidad)
#    pipelines/pl_andina_gold.yml     pipeline declarativo de gold   (un notebook por tabla)
#
#  Código (carpeta src/, numerada en el orden en que corre el job):
#    00_preparacion → 01_bronze → 02_silver → 03_gold · 04_validacion (manual, fuera del job)
#
#  Uso (desde la raíz del repositorio):
#    databricks bundle validate -t dev
#    databricks bundle deploy   -t dev
#    databricks bundle run job_andina_diario -t dev
#    databricks bundle deploy   -t prd        ← promoción a producción, sin tocar código
# =============================================================================
bundle:
  name: andina_market

include:
  - resources/*/*.yml

# Solo se sube al workspace el código que ejecutan los jobs y pipelines (src/) y la
# definición del bundle. Lo demás vive en Git: documentación, fuente simulada, pruebas
# locales, infraestructura y exploración.
sync:
  exclude:
    - docs/**
    - exploracion/**
    - fuentes/**
    - infra/**
    - sample_data/**
    - tests/**
    - "*.md"
    - "*.txt"
    - pytest.ini
    - .env.example

# -----------------------------------------------------------------------------
# Variables: lo ÚNICO que cambia entre ambientes
# -----------------------------------------------------------------------------
variables:
  catalogo:
    description: Catálogo de Unity Catalog del ambiente (andina_dev / andina_prd).
  secret_scope:
    description: Secret scope respaldado por el Key Vault del ambiente (credenciales de Azure SQL).
  storage_account:
    description: Cuenta ADLS Gen2 del ambiente (raíz de los Volumes externos de landing).
  correo_alertas:
    description: Destinatario de las alertas cuando el job falla.
    default: richardyony@gmail.com

# -----------------------------------------------------------------------------
# Targets: los dos ambientes
# -----------------------------------------------------------------------------
targets:
  dev:
    # Desarrollo: los recursos llevan el prefijo "[dev <usuario>]" y los horarios
    # quedan en pausa (nadie dispara corridas programadas por accidente).
    mode: development
    default: true
    workspace:
      host: https://adb-7405605614782968.8.azuredatabricks.net
    variables:
      catalogo: andina_dev
      secret_scope: kv-andina-dev
      storage_account: standinadevcus001

  prd:
    # Producción: validaciones más estrictas y carpeta que solo modifica quien despliega
    # (no /Workspace/Shared, editable por todos). Supuesto del reto: corre con el usuario
    # que despliega; en una empresa se usaría run_as con un service principal.
    mode: production
    workspace:
      host: https://adb-7405605614782968.8.azuredatabricks.net
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalogo: andina_prd
      secret_scope: kv-andina-prd
      storage_account: standinaprdcus001
