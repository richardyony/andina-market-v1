# =============================================================================
#  Pipeline GOLD (Lakeflow Declarative Pipelines)
#  silver → gold: modelo estrella (dimensiones y hechos)
#  - Un notebook por entidad en src/transformacion/gold/ (lista explícita abajo).
#  - root_path: permite que los notebooks importen los módulos comunes (.py).
#  - Serverless y triggered: procesa lo nuevo y se apaga (nunca continuous).
#  - Lo ejecuta la tarea transformacion_gold del job_andina_diario.
# =============================================================================
resources:
  pipelines:
    pl_andina_gold:
      name: pl_andina_gold
      catalog: ${var.catalogo}
      schema: gold                    # las tablas se publican en <catalogo>.gold
      serverless: true
      continuous: false
      channel: CURRENT
      root_path: ../src/transformacion/gold
      libraries:
        - notebook:
            path: ../src/transformacion/gold/dim_fecha.ipynb
        - notebook:
            path: ../src/transformacion/gold/dim_canal.ipynb
        - notebook:
            path: ../src/transformacion/gold/dim_productos.ipynb
        - notebook:
            path: ../src/transformacion/gold/dim_clientes.ipynb
        - notebook:
            path: ../src/transformacion/gold/fact_ventas.ipynb
        - notebook:
            path: ../src/transformacion/gold/fact_pagos.ipynb
      configuration:
        catalogo: ${var.catalogo}       # lo leen los módulos comunes con spark.conf.get("catalogo")
      tags:
        proyecto: andinamarket
        capa: gold
