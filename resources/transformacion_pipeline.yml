# =============================================================================
#  Pipeline de transformación (Lakeflow Declarative Pipelines): bronze → silver → gold
#  - silver.py: AUTO CDC (SCD1/SCD2), reglas de calidad y cuarentena
#  - gold.py  : modelo estrella (dimensiones y hechos)
#  Serverless y en modo triggered: procesa lo nuevo y se apaga (nunca continuous).
# =============================================================================
resources:
  pipelines:
    andina_transformacion:
      name: andina_transformacion
      catalog: ${var.catalogo}
      schema: silver                    # esquema por defecto; gold.py publica en <catalogo>.gold
      serverless: true
      continuous: false
      channel: CURRENT
      root_path: ../src/transformacion  # permite "from reglas_calidad import ..."
      libraries:
        - file:
            path: ../src/transformacion/silver.py
        - file:
            path: ../src/transformacion/gold.py
      configuration:
        catalogo: ${var.catalogo}
      tags:
        proyecto: andinamarket
        capa: transformacion
