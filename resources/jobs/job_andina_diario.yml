# =============================================================================
#  Job diario de Andina Market (Lakeflow Jobs) · ORQUESTACIÓN
#
#  Grafo de tareas (cada capa es una tarea; cada una espera a la anterior):
#
#    1. preparar_entorno ──▶ 2. ingesta_bronze ──▶ 3. transformacion_silver ──▶ 4. transformacion_gold ──▶ 5. validacion_final
#       esquemas y Volumes     Azure SQL (CDC) →      pipeline pl_andina_silver   pipeline pl_andina_gold     pruebas con condición
#       (IF NOT EXISTS)        landing → bronze       (calidad, SCD1/SCD2)        (modelo estrella)           de aprobación (falla = rojo)
#
#  Cómputo serverless (sin bloque de cluster). Diario a las 02:00 de Lima, en pausa
#  hasta pasar a producción. Si una tarea falla, las siguientes no corren y llega
#  un correo de alerta.
# =============================================================================
resources:
  jobs:
    job_andina_diario:
      name: job_andina_diario
      description: "Andina Market diario: preparar → bronze (ingesta CDC) → silver → gold → validación."

      tasks:
        # --- 1. Preparación: esquemas y Volumes que necesita la ingesta ---------
        - task_key: preparar_entorno
          notebook_task:
            notebook_path: ../../src/00_preparacion/nb_preparar_entorno.ipynb
            base_parameters:
              catalogo: ${var.catalogo}
              storage_account: ${var.storage_account}
              carpeta_landing: ${var.carpeta_landing}

        # --- 2. BRONZE: extracción CDC → landing → Auto Loader → bronze ---------
        - task_key: ingesta_bronze
          depends_on:
            - task_key: preparar_entorno
          notebook_task:
            notebook_path: ../../src/01_bronze/nb_bronze_sqlserver_ingesta.ipynb
            base_parameters:            # llenan los widgets del notebook
              catalogo: ${var.catalogo}
              secret_scope: ${var.secret_scope}
              etapa: todo
              tablas: "*"
              forzar_full: "false"
          max_retries: 1                # reintento seguro: el watermark solo avanza tras escribir

        # --- 3. SILVER: pipeline declarativo (un notebook por entidad) ----------
        - task_key: transformacion_silver
          depends_on:
            - task_key: ingesta_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.pl_andina_silver.id}
            full_refresh: false         # incremental: solo procesa lo nuevo de bronze

        # --- 4. GOLD: pipeline declarativo (un notebook por tabla) --------------
        - task_key: transformacion_gold
          depends_on:
            - task_key: transformacion_silver
          pipeline_task:
            pipeline_id: ${resources.pipelines.pl_andina_gold.id}
            full_refresh: false

        # --- 5. VALIDACIÓN: ¿la corrida hizo su trabajo? (no solo «terminó») -----
        #  Datos en cada capa, frescura, conciliación bronze = silver + cuarentena,
        #  clave única, una versión vigente por clave y gold = silver. Si una prueba
        #  falla, lanza un error: el job queda en rojo y llega la alerta.
        - task_key: validacion_final
          depends_on:
            - task_key: transformacion_gold
          notebook_task:
            notebook_path: ../../src/04_validacion/nb_validacion_final.ipynb
            base_parameters:
              catalogo: ${var.catalogo}
          max_retries: 0                # reintentar no arregla un dato malo

      performance_target: STANDARD      # serverless más barato; en batch no importa el arranque
      schedule:
        quartz_cron_expression: "0 0 2 * * ?"
        timezone_id: America/Lima
        pause_status: PAUSED            # se activa a propósito al pasar a producción
      max_concurrent_runs: 1            # nunca dos corridas sobre los mismos watermarks
      email_notifications:
        on_failure:
          - ${var.correo_alertas}
      tags:
        proyecto: andinamarket
